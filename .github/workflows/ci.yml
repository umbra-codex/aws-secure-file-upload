name: ci

# Runs on every push to any branch, and on demand:
#   scripts/remote-check.sh            (or the "Run workflow" button on the Actions tab)
on:
  push:
  workflow_dispatch:
    inputs:
      milestone:
        description: "Milestone to check, e.g. A1. Leave blank to use the branch name (a1-buckets -> A1)."
        required: false
        default: ""

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung terraform or tflint download must not hold the required check for
    # the runner's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The rule the 16 learner briefs share: every checkpoint names the command
      # the learner runs. A 17th brief inherits it by being linted, not by memory.
      - name: Briefs name the local check command
        run: scripts/lint-briefs.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      # Inputs arrive through env vars, never pasted into the script, so a
      # crafted milestone value can't run commands.
      - name: Work out which milestone to check
        id: target
        env:
          INPUT_MILESTONE: ${{ inputs.milestone }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          m="$INPUT_MILESTONE"
          if [ -n "$m" ] && ! printf '%s' "$m" | grep -Eq '^[A-Za-z0-9]{1,4}$'; then
            echo "::error::milestone must look like A1, M0, INT or SHIP"; exit 1
          fi
          if [ -z "$m" ]; then
            m=$(printf '%s' "$BRANCH" | sed -nE 's/^([a-dA-D][0-9]|[mM]0|[iI][nN][tT]|[sS][hH][iI][pP])([-_].*)?$/\1/p')
          fi
          m=$(printf '%s' "$m" | tr '[:lower:]' '[:upper:]')
          echo "milestone=$m" >> "$GITHUB_OUTPUT"
          # The gate runs only for a milestone that has a brief. "all" (which
          # check.sh treats as the whole ledger) and a typo have no brief, so
          # they go to the milestone checks and skip the gate instead of
          # failing it with "does not exist".
          gate=""
          if printf '%s' "$m" | grep -Eq '^(INT|SHIP|[A-D][0-9])$'; then gate=yes; fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "Checking ${m:-no branch milestone} plus everything in milestones.txt"

      # A milestone whose dependencies are not merged fails here, before the
      # spec tests, because the tests are mocked and would pass without them.
      - name: Dependencies are merged
        if: steps.target.outputs.gate == 'yes'
        env:
          MILESTONE: ${{ steps.target.outputs.milestone }}
        run: |
          # A ref the branch's clone does not track (a single-branch checkout)
          # needs the destination spelled out; `git fetch origin main` would
          # silently create nothing there.
          fetched=""
          for attempt in 1 2; do
            if git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main'; then
              fetched=yes
              break
            fi
            echo "::warning::could not fetch origin/main (attempt $attempt of 2)"
          done
          if [ -z "$fetched" ]; then
            echo "::error::could not fetch origin/main (network or permissions), so a merged dependency cannot be told from a missing one. Re-run this job; do not read this as a dependency failure."
            exit 1
          fi
          .github/scripts/deps.sh "$MILESTONE"

      - name: Cache the AWS provider
        uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ hashFiles('.terraform.lock.hcl') }}

      # fmt, init, validate, then the spec tests: this branch's milestone plus
      # every milestone already merged (regression). Results go to the run summary.
      - name: Milestone checks
        env:
          MILESTONE: ${{ steps.target.outputs.milestone }}
        # $MILESTONE is unquoted on purpose: when blank it must drop out of the
        # argument list, not become an empty first argument.
        run: .github/scripts/check.sh $MILESTONE all

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --config "$(pwd)/.tflint.hcl"
