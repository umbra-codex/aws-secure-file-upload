name: next

# Keeps one "<ID> is ready" issue per milestone in step with milestones.txt on
# main: opens it, assigned to the portion owner, when the last dependency merges,
# and closes it when the milestone itself merges. Runs on every push to main and
# every six hours, and it repairs anything an earlier run missed, so a cancelled
# run or an owner who accepted the invitation late loses nothing.
# By hand: Actions, next, "Run workflow".
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: next
  cancel-in-progress: false

jobs:
  notify:
    # A manual run from any other branch would read that branch's ledger.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Open and close the "ready" issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/notify.sh
